spring:
  profiles:
    active: prod

server:
  forward-headers-strategy: native

springdoc:
  api-docs:
    path: /swagger.json
  swagger-ui:
    path: /swagger-ui
    defaultModelsExpandDepth: -1

secrets:
  spotify_api:
    id: ${SPOTIFY_API_CLIENT_ID}
    secret: ${SPOTIFY_API_CLIENT_SECRET}
  tidal_api:
    id: ${TIDAL_API_CLIENT_ID}
    secret: ${TIDAL_API_CLIENT_SECRET}

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: "health,info"
      path-mapping:
        health: "health"
        info: "info"
  endpoint:
    health:
      show-details: always
    info:
      enabled: true
  info:
    build:
      enabled: true
    env:
      enabled: true