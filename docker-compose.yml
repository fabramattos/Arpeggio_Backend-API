## Docker compose serve apenas para execução local!

name: Arpeggio

services:
  arpeggio:
    container_name: API
    build:
      context: .
      dockerfile: Dockerfile
    image: arpeggio-api
    networks:
      - arpeggio-network
    ports:
      - "8080:8080"
      - "5005:5005" #depuração remota no container
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: dev
      JAVA_TOOL_OPTIONS: -agentlib:jdwp=transport=dt_socket,address=*:5005,server=y,suspend=n

    command: ["java", "-XX:+UseContainerSupport", "-jar", "app.jar"]

networks:
  arpeggio-network:
    driver: bridge